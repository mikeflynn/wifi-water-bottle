# DHCP for the direct laptop <-> Pi Ethernet link.
#
# The laptop needs no manual IP configuration: it stays on DHCP (the macOS
# default) and this hands it the single address the /30 has room for.
#
# port=0 disables the DNS listener entirely — this is a DHCP server only, so
# eth0 exposes UDP/67 and nothing else beyond the agent's own 7443.
port=0
interface=eth0
bind-interfaces
dhcp-authoritative

# 10.77.0.0/30 has exactly two host addresses: .1 is the Pi, .2 is the laptop.
dhcp-range=10.77.0.2,10.77.0.2,255.255.255.252,12h

# Send no router (3) and no DNS server (6). Both matter: macOS usually ranks
# Ethernet above Wi-Fi in service order, so an offer carrying a gateway would
# steal the laptop's default route and break its internet the moment the
# bottle is plugged in.
dhcp-option=3
dhcp-option=6
